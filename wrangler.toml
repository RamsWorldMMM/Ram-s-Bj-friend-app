# ============================================================================
#  Cloudflare configuration.
#
#  database_id below is a real D1 database on the account this was deployed
#  from. It is an identifier, not a secret. If you deploy from a DIFFERENT
#  Cloudflare account, this id will not resolve — create your own with
#     npx wrangler d1 create rams-bj-friend
#  and paste the returned id here.
#
#  Secrets are NOT in this file and never should be. Set them once per
#  environment and they survive redeploys:
#     npx wrangler secret put AUTH_SECRET
#     npx wrangler secret put GCP_SERVICE_ACCOUNT_JSON
# ============================================================================

name = "rams-bj-friend"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# The app itself. Anything that isn't a static file falls through to the Worker,
# which only claims /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# SQLite. Create with:
#   npx wrangler d1 create rams-bj-friend
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "rams-bj-friend"
database_id = "e0a11dec-cf72-48a9-a11c-8a01a8dcaef0"

[vars]
VERTEX_LOCATION = "us-central1"
VERTEX_MODEL = "gemini-2.5-flash"
# GCP_PROJECT_ID is set here (not a secret — it's just an identifier).
GCP_PROJECT_ID = "tryonme-20260731"     # <-- must match YOUR deployed project

# Gemini 2.5 draws thinking tokens from the same budget as the answer, so
# MAX_OUTPUT must cover both or the JSON is truncated mid-object.
#
# 12000 was not enough: 4096 of it went to thinking, leaving under 8000 for a
# response schema with ten top-level sections, and a real session failed with
# "truncated mid-JSON". Billing is per token GENERATED, not per token budgeted,
# so headroom here costs nothing until it is used.
# gemini-2.5-flash accepts up to 65535.
VERTEX_MAX_OUTPUT_TOKENS = "32000"
VERTEX_THINKING_BUDGET = "4096"

# Secrets — never put these in this file. Set them with:
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put GCP_SERVICE_ACCOUNT_JSON
#
# AUTH_SECRET              random 32+ byte string, signs session cookies
# GCP_SERVICE_ACCOUNT_JSON the full service-account JSON key, pasted verbatim

[observability]
enabled = true
