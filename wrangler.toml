# ============================================================================
#  READ THIS FIRST  —  DO NOT COPY THIS FILE OVER YOUR WORKING wrangler.toml
# ============================================================================
#  This copy comes from the author's machine. Two values below are placeholders
#  and are WRONG for the live deployment:
#
#     database_id     -> "local-dev-placeholder"  (NOT the real D1 database)
#     GCP_PROJECT_ID  -> may differ from the project you deployed with
#
#  If you already have a working wrangler.toml, KEEP YOURS and copy over
#  everything else (public/, src/, schema.sql, tests/, package.json).
#
#  If you must use this file, replace database_id with the id from:
#     npx wrangler d1 list
#  Deploying with the placeholder will fail or point at the wrong database,
#  and the app will look empty because none of the existing play is in it.
#
#  Secrets (AUTH_SECRET, GCP_SERVICE_ACCOUNT_JSON) live in Cloudflare, not
#  here, and survive a redeploy untouched.
# ============================================================================

name = "rams-bj-friend"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# The app itself. Anything that isn't a static file falls through to the Worker,
# which only claims /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# SQLite. Create with:
#   npx wrangler d1 create rams-bj-friend
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "rams-bj-friend"
database_id = "local-dev-placeholder"   # <-- REPLACE or keep your own file

[vars]
VERTEX_LOCATION = "us-central1"
VERTEX_MODEL = "gemini-2.5-flash"
# GCP_PROJECT_ID is set here (not a secret — it's just an identifier).
GCP_PROJECT_ID = "tryonme-20260731"     # <-- must match YOUR deployed project

# Gemini 2.5 draws thinking tokens from the same budget as the answer, so
# MAX_OUTPUT must cover both or the JSON is truncated mid-object.
# Lower THINKING_BUDGET to trade some analysis depth for a faster response.
VERTEX_MAX_OUTPUT_TOKENS = "12000"
VERTEX_THINKING_BUDGET = "4096"

# Secrets — never put these in this file. Set them with:
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put GCP_SERVICE_ACCOUNT_JSON
#
# AUTH_SECRET              random 32+ byte string, signs session cookies
# GCP_SERVICE_ACCOUNT_JSON the full service-account JSON key, pasted verbatim

[observability]
enabled = true
